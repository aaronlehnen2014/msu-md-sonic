name: Temporary Karate Fix6 .NET 4.8 Transport

on:
  push:
    paths:
      - '.github/workflows/tmp-karate-fix6-dotnet48-transport.yml'
  workflow_dispatch:

jobs:
  fetch-dotnet48:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Download and authenticate official .NET Framework 4.8 offline installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download.visualstudio.microsoft.com/download/pr/2d6bb6b2-226a-4baa-bdec-798822606ff1/8494001c276a4b96804cde7829c04d7f/ndp48-x86-x64-allos-enu.exe'
          $out = Join-Path $PWD 'NDP48-x86-x64-AllOS-ENU.exe'
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing -TimeoutSec 300
          if ((Get-Item $out).Length -lt 100MB) { throw 'Installer is unexpectedly small.' }
          $sig = Get-AuthenticodeSignature $out
          Write-Host "Signature status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch 'Microsoft') { throw "Unexpected signer: $($sig.SignerCertificate.Subject)" }
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $out).Length
          Write-Host "DOTNET48_SHA256=$hash"
          Write-Host "DOTNET48_SIZE=$size"

      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: karate-fix6-dotnet48-offline
          path: NDP48-x86-x64-AllOS-ENU.exe
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
